<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>プロセカ周回ツール - Windows 7 (Pink Edition)</title>
    
    <!-- PWA / Android 対応 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF69B4">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS 対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="周回ツール">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/FF69B4/FFFFFF?text=周回">
    
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        body { background-color: #87CEEB; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: "Segoe UI", "Meiryo", sans-serif; }
        .window { width: 100%; max-width: 450px; box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3); border: 1px solid #FF69B4; }
        .title-bar { background: linear-gradient(180deg, #ff99cc 0%, #ff3399 100%); border-bottom: 1px solid #ff0066; }
        .window-body { margin: 12px; background: #FFF0F5; padding: 4px; border-radius: 2px; }
        menu[role="tablist"] { margin-bottom: -1px; gap: 2px; overflow-x: auto; white-space: nowrap; padding-left: 5px; padding-top: 5px; z-index: 2; position: relative; }
        menu[role="tablist"] li { margin-right: 0; display: inline-block; }
        menu[role="tablist"] li a { padding: 10px 22px; font-size: 1rem; display: block; background: linear-gradient(180deg, #f8f8f8 0%, #e1e1e1 100%); border: 1px solid #8E8F8F; border-bottom: none; border-top-left-radius: 4px; border-top-right-radius: 4px; color: #333; text-decoration: none; position: relative; top: 2px; transition: all 0.1s; }
        menu[role="tablist"] li:not(.active) a { background: linear-gradient(180deg, #FFF0F5 0%, #FFE4E1 100%); border-color: #FFB6C1; }
        menu[role="tablist"] li.active a { background: white; font-weight: bold; color: #FF1493; border: 1px solid #FFB6C1; border-bottom: 1px solid white !important; top: 0; padding-bottom: 11px; z-index: 3; }
        .tab-content { display: none; padding: 20px 15px; background: white; border: 1px solid #FFB6C1; box-shadow: 0 -1px 0 white inset; min-height: 320px; position: relative; z-index: 1; }
        .tab-content.active { display: block; }
        fieldset { border-color: #FFB6C1; background: #FFF9FA; }
        legend { color: #FF1493; font-weight: bold; }
        .field-row-stacked { margin-bottom: 15px; }
        .field-row-stacked label { margin-bottom: 5px; display: block; font-weight: bold; color: #D81B60; }
        input[type="number"] { width: 100%; height: 42px; font-size: 1.1rem; padding: 0 10px; border: 1px solid #FFB6C1; }
        button { min-height: 44px; min-width: 90px; font-size: 1rem !important; padding: 0 15px; cursor: pointer; }
        .result-display { margin-top: 20px; padding: 15px; background: #FFF0F5; border: 2px dashed #FF69B4; text-align: center; }
        .result-value { font-size: 2.5rem; font-weight: bold; color: #FF1493; }
        .counter-box { text-align: center; }
        .counter-value { font-size: 5rem; font-weight: bold; margin: 15px 0; font-family: "Consolas", monospace; background: #222; color: #FF69B4; padding: 20px; border: 4px inset #FFB6C1; text-shadow: 0 0 12px #FF69B4; }
        .message-box { min-height: 50px; margin-bottom: 10px; font-weight: bold; color: #FF1493; font-size: 1.1rem; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; border: 1px inset #FFB6C1; background: white; }
        .history-item { padding: 12px 10px; border-bottom: 1px solid #FFF0F5; display: flex; justify-content: space-between; }
        .history-item span:last-child { color: #FF1493; font-weight: bold; }
        .empty-state { text-align: center; color: #FFB6C1; padding: 40px 0; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .button-group button { flex: 1; }
        .status-bar { background: #FFE4E1; color: #FF69B4; border-top: 1px solid #FFB6C1; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="title-bar-text">プロセカ周回ツール</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <menu role="tablist">
            <li role="tab" class="active" id="tab-btn-calc"><a href="#calc" onclick="showTab('calc')">実効値計算</a></li>
            <li role="tab" id="tab-btn-counter"><a href="#counter" onclick="showTab('counter')">カウンター</a></li>
            <li role="tab" id="tab-btn-history"><a href="#history" onclick="showTab('history')">履歴</a></li>
        </menu>

        <div class="window" role="tabpanel">
            <div id="tab-calc" class="tab-content active">
                <fieldset>
                    <legend>マルチ実効値計算</legend>
                    <div class="field-row-stacked"><label>リーダー (%)</label><input type="number" id="leader" value="130"></div>
                    <div class="field-row-stacked"><label>サブ1 (%)</label><input type="number" class="sub-skill" value="110"></div>
                    <div class="field-row-stacked"><label>サブ2 (%)</label><input type="number" class="sub-skill" value="110"></div>
                    <div class="field-row-stacked"><label>サブ3 (%)</label><input type="number" class="sub-skill" value="110"></div>
                    <div class="field-row-stacked"><label>サブ4 (%)</label><input type="number" class="sub-skill" value="110"></div>
                    <section class="field-row" style="justify-content: flex-end;"><button onclick="calculate()">計算</button></section>
                </fieldset>
                <div class="result-display" id="calc-result" style="display:none;"><p>マルチスコアアップ値</p><div class="result-value" id="result-val">0%</div></div>
            </div>

            <div id="tab-counter" class="tab-content">
                <fieldset>
                    <legend>周回カウンター</legend>
                    <div id="setup-view">
                        <div class="field-row-stacked"><label>周回数</label><input type="number" id="total-laps" value="10"></div>
                        <section class="field-row" style="justify-content: center;"><button onclick="startGrind()">スタート</button></section>
                    </div>
                    <div id="grind-view" style="display:none;" class="counter-box">
                        <div class="message-box" id="grind-message"></div>
                        <p>残り</p><div class="counter-value" id="remaining-val">0</div>
                        <div class="button-group"><button onclick="decrement()">1回終了</button><button onclick="resetCounter()">リセット</button></div>
                    </div>
                </fieldset>
            </div>

            <div id="tab-history" class="tab-content">
                <fieldset>
                    <legend>履歴</legend>
                    <div id="history-container"><div class="empty-state">履歴なし</div></div>
                    <section class="field-row" style="justify-content: center; margin-top: 10px;"><button id="clear-history-btn" onclick="clearHistory()" style="display:none;">削除</button></section>
                </fieldset>
            </div>
        </div>
        <footer class="status-bar"><p class="status-bar-field">Ready</p><p class="status-bar-field">v1.1.0</p></footer>
    </div>
</div>

<script>
    let state = {
        remaining: parseInt(localStorage.getItem('proseka_remaining') || 0),
        history: JSON.parse(localStorage.getItem('proseka_history') || '[]'),
        isGrinding: !!localStorage.getItem('proseka_remaining')
    };

    window.onload = () => {
        if (state.isGrinding) updateCounterUI();
        renderHistory();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(r => console.log('SW OK'));
        }
    };

    function showTab(id) {
        event.preventDefault();
        document.querySelectorAll('.tab-content, menu li').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('tab-btn-' + id).classList.add('active');
    }

    function calculate() {
        const leader = parseFloat(document.getElementById('leader').value) || 0;
        const sub = Array.from(document.querySelectorAll('.sub-skill')).reduce((a, b) => a + (parseFloat(b.value) || 0), 0);
        document.getElementById('result-val').innerText = (leader + sub * 0.2).toFixed(1) + '%';
        document.getElementById('calc-result').style.display = 'block';
    }

    function startGrind() {
        state.remaining = parseInt(document.getElementById('total-laps').value) || 0;
        if (state.remaining <= 0) return;
        state.isGrinding = true;
        save();
        updateCounterUI();
    }

    function decrement() {
        if (state.remaining <= 0) return;
        state.remaining--;
        if (state.remaining === 0) {
            saveToHistory();
            localStorage.removeItem('proseka_remaining');
            state.isGrinding = false;
        } else {
            save();
        }
        updateCounterUI();
    }

    function resetCounter() { if (confirm('リセット？')) { state.remaining = 0; state.isGrinding = false; localStorage.removeItem('proseka_remaining'); updateCounterUI(); } }
    function save() { localStorage.setItem('proseka_remaining', state.remaining); }

    function updateCounterUI() {
        document.getElementById('setup-view').style.display = state.isGrinding ? 'none' : 'block';
        document.getElementById('grind-view').style.display = state.isGrinding ? 'block' : 'none';
        document.getElementById('remaining-val').innerText = state.remaining;
        const msg = document.getElementById('grind-message');
        if (state.remaining === 1) msg.innerText = '次でラスト！おつさき！';
        else if (state.remaining === 0 && state.isGrinding) msg.innerText = 'お疲れさま！';
        else msg.innerText = '';
    }

    function saveToHistory() {
        const d = new Date();
        state.history.unshift({ date: `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`, message: '周回終了' });
        localStorage.setItem('proseka_history', JSON.stringify(state.history));
        renderHistory();
    }

    function renderHistory() {
        const c = document.getElementById('history-container');
        const b = document.getElementById('clear-history-btn');
        if (state.history.length === 0) { c.innerHTML = '<div class="empty-state">履歴なし</div>'; b.style.display = 'none'; return; }
        c.innerHTML = '<ul class="history-list">' + state.history.map(i => `<li class="history-item"><span>${i.date}</span><span>${i.message}</span></li>`).join('') + '</ul>';
        b.style.display = 'block';
    }

    function clearHistory() { if (confirm('削除？')) { state.history = []; localStorage.setItem('proseka_history', '[]'); renderHistory(); } }
</script>
</body>
</html>
