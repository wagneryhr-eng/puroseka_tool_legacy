<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>プロセカ周回ツール - Windows 7 (Pink Edition)</title>
    <link rel="manifest" href="./manifest.json">
    
    <!-- PWA / iOS 対応用のメタタグ -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="周回ツール">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/GoogleChrome/lighthouse/master/lighthouse-core/scripts/images/pwa-lightning.png">
    
    <meta name="theme-color" content="#FF69B4">
    <!-- 7.css の読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        body {
            /* 背景を水色一色に変更 */
            background-color: #87CEEB;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: "Segoe UI", "Meiryo", sans-serif;
        }

        .window {
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
            border: 1px solid #FF69B4; /* ウィンドウの境界線もピンクに */
        }

        /* タイトルバーをよりビビッドなピンクに */
        .title-bar {
            background: linear-gradient(180deg, #ff99cc 0%, #ff3399 100%);
            border-bottom: 1px solid #ff0066;
        }

        .window-body {
            margin: 12px;
            background: #FFF0F5; /* ウィンドウ内部を薄いピンクに */
            padding: 4px;
            border-radius: 2px;
        }

        /* 7.css のタブ調整 - Windows 7 のプロパティ画面風 */
        menu[role="tablist"] {
            margin-bottom: -1px; /* コンテンツの境界線と重ねる */
            gap: 2px;
            overflow-x: auto;
            white-space: nowrap;
            padding-left: 5px;
            padding-top: 5px;
            z-index: 2;
            position: relative;
        }

        menu[role="tablist"] li {
            margin-right: 0;
            display: inline-block;
        }

        menu[role="tablist"] li a {
            padding: 10px 22px; /* タッチしやすい大きさを維持 */
            font-size: 1rem;
            display: block;
            background: linear-gradient(180deg, #f8f8f8 0%, #e1e1e1 100%); /* 標準的なタブの色 */
            border: 1px solid #8E8F8F;
            border-bottom: none;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            color: #333;
            text-decoration: none;
            position: relative;
            top: 2px; /* 非アクティブ時は少し下げる */
            transition: all 0.1s;
        }

        /* 非アクティブなタブをピンク系に */
        menu[role="tablist"] li:not(.active) a {
            background: linear-gradient(180deg, #FFF0F5 0%, #FFE4E1 100%);
            border-color: #FFB6C1;
        }

        menu[role="tablist"] li.active a {
            background: white;
            font-weight: bold;
            color: #FF1493;
            border: 1px solid #FFB6C1; /* コンテンツの枠線と合わせる */
            border-bottom: 1px solid white !important; /* 下線を消して連結 */
            top: 0; /* アクティブ時は上に持ち上げる */
            padding-bottom: 11px; /* 下線を消した分補正 */
            z-index: 3;
        }

        .tab-content {
            display: none;
            padding: 20px 15px;
            background: white;
            border: 1px solid #FFB6C1;
            box-shadow: 0 -1px 0 white inset; /* 内側に白い線をいれて立体感を出す */
            min-height: 320px;
            position: relative;
            z-index: 1;
        }

        .tab-content.active {
            display: block;
        }

        fieldset {
            border-color: #FFB6C1;
            background: #FFF9FA;
        }

        legend {
            color: #FF1493;
            font-weight: bold;
        }

        .field-row-stacked {
            margin-bottom: 15px;
        }

        .field-row-stacked label {
            margin-bottom: 5px;
            display: block;
            font-weight: bold;
            color: #D81B60;
        }

        input[type="number"] {
            width: 100%;
            height: 42px;
            font-size: 1.1rem;
            padding: 0 10px;
            border: 1px solid #FFB6C1;
        }

        input[type="number"]:focus {
            outline: 2px solid #FF69B4;
        }

        button {
            min-height: 44px;
            min-width: 90px;
            font-size: 1rem !important;
            padding: 0 15px;
        }

        .result-display {
            margin-top: 20px;
            padding: 15px;
            background: #FFF0F5;
            border: 2px dashed #FF69B4;
            text-align: center;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FF1493;
        }

        .counter-box {
            text-align: center;
        }

        .counter-value {
            font-size: 5rem;
            font-weight: bold;
            margin: 15px 0;
            font-family: "Consolas", "Courier New", monospace;
            background: #222;
            color: #FF69B4;
            padding: 20px;
            border: 4px inset #FFB6C1;
            text-shadow: 0 0 12px #FF69B4;
        }

        .message-box {
            min-height: 50px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #FF1493;
            font-size: 1.1rem;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
            border: 1px inset #FFB6C1;
            background: white;
        }

        .history-item {
            padding: 12px 10px;
            border-bottom: 1px solid #FFF0F5;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }

        .history-item span:last-child {
            color: #FF1493;
            font-weight: bold;
        }

        .history-item:hover {
            background: #FFF0F5;
        }

        .empty-state {
            text-align: center;
            color: #FFB6C1;
            padding: 40px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button {
            flex: 1;
        }

        .status-bar {
            background: #FFE4E1;
            color: #FF69B4;
            border-top: 1px solid #FFB6C1;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="title-bar-text">プロセカ周回ツール</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <menu role="tablist">
            <li role="tab" class="active" id="tab-btn-calc"><a href="#calc" onclick="showTab('calc')">実効値計算</a></li>
            <li role="tab" id="tab-btn-counter"><a href="#counter" onclick="showTab('counter')">カウンター</a></li>
            <li role="tab" id="tab-btn-history"><a href="#history" onclick="showTab('history')">履歴</a></li>
        </menu>

        <div class="window" role="tabpanel">
            <!-- 計算タブ -->
            <div id="tab-calc" class="tab-content active">
                <fieldset>
                    <legend>マルチ実効値計算</legend>
                    <div class="field-row-stacked">
                        <label for="leader">リーダースキル値 (%)</label>
                        <input type="number" id="leader" value="130">
                    </div>
                    <div class="field-row-stacked">
                        <label>サブ1 (%)</label>
                        <input type="number" class="sub-skill" value="110">
                    </div>
                    <div class="field-row-stacked">
                        <label>サブ2 (%)</label>
                        <input type="number" class="sub-skill" value="110">
                    </div>
                    <div class="field-row-stacked">
                        <label>サブ3 (%)</label>
                        <input type="number" class="sub-skill" value="110">
                    </div>
                    <div class="field-row-stacked">
                        <label>サブ4 (%)</label>
                        <input type="number" class="sub-skill" value="110">
                    </div>
                    <section class="field-row" style="justify-content: flex-end;">
                        <button onclick="calculate()">計算する</button>
                    </section>
                </fieldset>
                
                <div class="result-display" id="calc-result" style="display:none;">
                    <p>マルチスコアアップ値</p>
                    <div class="result-value" id="result-val">0%</div>
                </div>
            </div>

            <!-- カウンタータブ -->
            <div id="tab-counter" class="tab-content">
                <fieldset>
                    <legend>周回カウンター</legend>
                    <div id="setup-view">
                        <div class="field-row-stacked">
                            <label for="total-laps">周回したい回数を入力</label>
                            <input type="number" id="total-laps" value="10">
                        </div>
                        <section class="field-row" style="justify-content: center; margin-top: 10px;">
                            <button onclick="startGrind()">スタート！</button>
                        </section>
                    </div>

                    <div id="grind-view" style="display:none;" class="counter-box">
                        <div class="message-box" id="grind-message"></div>
                        <p>残り回数</p>
                        <div class="counter-value" id="remaining-val">0</div>
                        <div class="button-group">
                            <button onclick="decrement()">1回終了</button>
                            <button onclick="resetCounter()">リセット</button>
                        </div>
                    </div>
                </fieldset>
            </div>

            <!-- 履歴タブ -->
            <div id="tab-history" class="tab-content">
                <fieldset>
                    <legend>周回履歴</legend>
                    <div id="history-container">
                        <div class="empty-state">履歴がありません</div>
                    </div>
                    <section class="field-row" style="justify-content: center; margin-top: 10px;">
                        <button id="clear-history-btn" onclick="clearHistory()" style="display:none;">履歴を削除</button>
                    </section>
                </fieldset>
            </div>
        </div>

        <footer class="status-bar">
            <p class="status-bar-field">Ready</p>
            <p class="status-bar-field">CPU Usage: 0%</p>
            <p class="status-bar-field">v1.0.0</p>
        </footer>
    </div>
</div>

<script>
    // 状態管理
    let state = {
        remaining: 0,
        history: JSON.parse(localStorage.getItem('proseka_history') || '[]'),
        isGrinding: false
    };

    // 初期化
    window.onload = () => {
        const savedRemaining = localStorage.getItem('proseka_remaining');
        if (savedRemaining !== null && savedRemaining > 0) {
            state.remaining = parseInt(savedRemaining);
            state.isGrinding = true;
            updateCounterUI();
        }
        renderHistory();

        // サービスワーカーの登録 (PWA用)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered!'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    };

    // タブ切り替え
    function showTab(tabId) {
        event.preventDefault();
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('menu[role="tablist"] li').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
    }

    // 計算ロジック
    function calculate() {
        const leader = parseFloat(document.getElementById('leader').value) || 0;
        const subs = Array.from(document.querySelectorAll('.sub-skill'))
            .map(input => parseFloat(input.value) || 0);
        
        const subTotal = subs.reduce((a, b) => a + b, 0);
        const result = leader + (subTotal * 0.2);
        
        const resultDisplay = document.getElementById('calc-result');
        const resultVal = document.getElementById('result-val');
        
        resultVal.innerText = result.toFixed(1) + '%';
        resultDisplay.style.display = 'block';
    }

    // カウンターロジック
    function startGrind() {
        const total = parseInt(document.getElementById('total-laps').value) || 0;
        if (total <= 0) return;

        state.remaining = total;
        state.isGrinding = true;
        localStorage.setItem('proseka_remaining', state.remaining);
        updateCounterUI();
    }

    function decrement() {
        if (state.remaining <= 0) return;
        
        state.remaining--;
        localStorage.setItem('proseka_remaining', state.remaining);
        
        if (state.remaining === 0) {
            saveToHistory();
            localStorage.removeItem('proseka_remaining');
        }
        
        updateCounterUI();
    }

    function resetCounter() {
        if (confirm('リセットしてもよろしいですか？')) {
            state.remaining = 0;
            state.isGrinding = false;
            localStorage.removeItem('proseka_remaining');
            updateCounterUI();
        }
    }

    function updateCounterUI() {
        const setupView = document.getElementById('setup-view');
        const grindView = document.getElementById('grind-view');
        const remainingVal = document.getElementById('remaining-val');
        const messageBox = document.getElementById('grind-message');

        if (state.isGrinding) {
            setupView.style.display = 'none';
            grindView.style.display = 'block';
            remainingVal.innerText = state.remaining;

            if (state.remaining === 1) {
                messageBox.innerText = '次でラスト！おつさきスタンプ打とう！';
            } else if (state.remaining === 0) {
                messageBox.innerText = '周回お疲れさま！';
            } else {
                messageBox.innerText = '';
            }
        } else {
            setupView.style.display = 'block';
            grindView.style.display = 'none';
        }
    }

    // 履歴管理
    function saveToHistory() {
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        state.history.unshift({
            date: dateStr,
            message: '周回終了'
        });
        
        localStorage.setItem('proseka_history', JSON.stringify(state.history));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        const clearBtn = document.getElementById('clear-history-btn');
        
        if (state.history.length === 0) {
            container.innerHTML = '<div class="empty-state">履歴がありません</div>';
            clearBtn.style.display = 'none';
            return;
        }

        let html = '<ul class="history-list">';
        state.history.forEach(item => {
            html += `
                <li class="history-item">
                    <span>${item.date}</span>
                    <span style="font-weight:bold;">${item.message}</span>
                </li>
            `;
        });
        html += '</ul>';
        
        container.innerHTML = html;
        clearBtn.style.display = 'block';
    }

    function clearHistory() {
        if (confirm('履歴を全て削除しますか？')) {
            state.history = [];
            localStorage.setItem('proseka_history', '[]');
            renderHistory();
        }
    }
</script>

</body>
</html>
